name = "ishtc-proxy"
main = "worker.js"
compatibility_date = "2026-08-01"

# KV：快取 + 用量計數（必要）
# 建立：npx wrangler kv namespace create CACHE
# 然後把回傳的 id 貼進來
[[kv_namespaces]]
binding = "CACHE"
id = "把你的 KV namespace id 貼在這裡"

# D1：查詢記錄（選用，之後做排行榜要用）
# 建立：npx wrangler d1 create ishtc-logs
# 建表：npx wrangler d1 execute ishtc-logs --file=schema.sql --remote
# [[d1_databases]]
# binding = "DB"
# database_name = "ishtc-logs"
# database_id = "把你的 D1 database id 貼在這裡"

[vars]
# 額度上限（超過就回冷卻）。升級方案之後改這兩個數字重新部署即可
HELIUS_MONTHLY_CREDITS = "1000000"
ST_MONTHLY_LIMIT = "10000"
IP_RATE_PER_MIN = "120"

# 兩把 key 用 secret 存，不要寫在這個檔案裡：
#   npx wrangler secret put HELIUS_KEY
#   npx wrangler secret put ST_KEY
