name = "ishtc-proxy"
main = "worker.js"
compatibility_date = "2026-08-01"

# KV：快取 + 用量計數（必要）
# 建立：npx wrangler kv namespace create CACHE
# 然後把回傳的 id 貼進來
[[kv_namespaces]]
binding = "CACHE"
id = "043b9ae7f4084792bbd5d80fa3948d13"

# D1：查詢記錄（選用，之後做排行榜要用）
# 建立：npx wrangler d1 create ishtc-logs
# 建表：npx wrangler d1 execute ishtc-logs --file=schema.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "ishtc-logs"
database_id = "287438fb-09ab-419c-950f-1ade78e60ccb"

# 每十分鐘預載一小批（免金鑰的 GeckoTerminal，不花 Solana Tracker 額度）
# 小批次高頻率：Workers 共用對外 IP，被 GeckoTerminal 擋是常態，下一輪再補就好
[triggers]
crons = ["*/10 * * * *"]

[vars]
# 額度上限（超過就回冷卻），都是「每一把 key」的量，總量會自動乘上把數。
# 升級方案之後改這兩個數字重新部署即可。
HELIUS_MONTHLY_CREDITS = "1000000"
ST_MONTHLY_LIMIT = "2500"      # Solana Tracker 免費方案每月 2,500 次
IP_RATE_PER_MIN = "600"

# key 用 secret 存，不要寫在這個檔案裡：
#   npx wrangler secret put HELIUS_KEY     ← 一把
#   npx wrangler secret put ST_KEY
#
# 有很多把免費 key 想輪流用（額度與速率都會乘上把數）：
#   npx wrangler secret put HELIUS_KEYS    ← 貼「key1,key2,key3」逗號分隔
#   npx wrangler secret put ST_KEYS
# 上面兩個上限是「每一把」的月額度，總量會自動乘上把數。
# 某把被拒（401/429）會自動冰起來換下一把，/health 看得到每把的用量。
